# Release automation.
#
# Two install paths matter: `github:misswell/dsh-advanced-provider-settings`,
# which needs no build because `lib/` is committed, and this release tarball,
# which pins a fixed content-hashed artifact. pnpm 10+ blocks the `prepare`
# build for git dependencies and DSH never writes `allowBuilds`, so a plugin
# that needs building must ship prebuilt `lib/*.js` either way.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish the tarball
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before publishing
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm test

      # Compute the filename here: the `body:` input below is not a shell, so a
      # `$(ls *.tgz)` substitution written into it would be published verbatim
      # instead of expanded.
      - name: Resolve the tarball name
        id: tarball
        run: echo "name=$(basename "$(ls *.tgz)")" >> "$GITHUB_OUTPUT"

      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
          body: |
            Install straight from the repository (no build required):

            ```bash
            dsh plugin --profile web add github:${{ github.repository }}
            ```

            Or pin this exact artifact:

            ```bash
            dsh plugin --profile web add https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.tarball.outputs.name }}
            ```

            Or from npm once published:

            ```bash
            dsh plugin --profile web add dsh-advanced-provider-settings
            ```
