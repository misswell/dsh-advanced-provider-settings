# Continuous integration for dsh-advanced-provider-settings.
#
# The gate mirrors section 74 of the project spec exactly: build, typecheck,
# lint, test, and a packaging dry run. `npm run build` runs first because the
# integration suite loads the BUILT artifacts rather than the sources — a bundle
# that fails to materialise is a real failure and must fail here, not in
# somebody's Harness profile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: build · typecheck · lint · test · pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is the current LTS.
        node: ['20', '22']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Packaging dry run
        run: npm pack --dry-run

      - name: Upload the release tarball
        if: matrix.node == '20'
        run: npm pack

      - name: Store the tarball
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-advanced-provider-settings-tgz
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 30
